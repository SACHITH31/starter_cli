name: Release package verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify npm package contents
        run: |
          npm pack --dry-run
          npm pack --pack-destination "$RUNNER_TEMP"
          node -e "const p=require('./package.json');if(p.version!=='1.3.0')process.exit(1)"
